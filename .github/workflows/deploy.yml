name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current upload.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://lydiagrozaweb.com

      - name: Upload changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # The hosting server's own hostname (*.inmotionhosting.com), not the
          # domain (proxied by Cloudflare, no FTP) or bare IP (fails TLS check).
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          # The FTP account's home folder is the site root (lydiagrozaweb.com/).
          server-dir: ./
